<style>
/* Layout: three views in one file — Home, App Directory (#apps, searchable grid) and App Detail (#app-<id>). App data lives in apps.json. Deep field green, durian yellow used sparingly, square-cornered controls. */
:root{
  --bg:#F3F5EF;--surface:#FFFFFF;--fg:#11241A;--muted:#4D5F53;--line:#D3DACD;--line-strong:#AEB9A8;
  --deep:#122E20;--on-deep:#ECF1E7;--on-deep-2:#B7C6B6;--deep-line:#2B4A38;
  --accent:#D9A821;--accent-ink:#7A5800;--on-accent:#1A1400;
  --fc:#2F7FC1;--good:#2F8F46;--mid:#7E9426;--weak:#C0612A;--error:#B3261E;
  --r:4px;--r-card:6px;
  --font-display:"Bricolage Grotesque","Noto Sans SC",system-ui,sans-serif;
  --font-body:"Figtree","Noto Sans SC",system-ui,sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A12;--surface:#122319;--fg:#E7EDE2;--muted:#9FB1A3;--line:#243A2C;--line-strong:#3A5544;
    --deep:#08130D;--on-deep:#E7EDE2;--on-deep-2:#9FB1A3;--deep-line:#1F3528;
    --accent:#E9BC3A;--accent-ink:#E9BC3A;--on-accent:#1A1400;
    --fc:#62A9E6;--good:#52B469;--mid:#B3C04A;--weak:#E3814A;--error:#F2B8B5;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1A12;--surface:#122319;--fg:#E7EDE2;--muted:#9FB1A3;--line:#243A2C;--line-strong:#3A5544;
  --deep:#08130D;--on-deep:#E7EDE2;--on-deep-2:#9FB1A3;--deep-line:#1F3528;
  --accent:#E9BC3A;--accent-ink:#E9BC3A;--on-accent:#1A1400;
  --fc:#62A9E6;--good:#52B469;--mid:#B3C04A;--weak:#E3814A;--error:#F2B8B5;color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.7;margin:0;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding-inline:24px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.12;letter-spacing:-.01em;font-weight:600}
p{margin:0}
a{color:inherit}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.label{font:600 12px var(--font-body);letter-spacing:.18em;text-transform:uppercase;color:var(--accent-ink);display:flex;align-items:center;gap:12px}
.label::before{content:"";width:24px;height:1px;background:currentColor}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--deep);color:var(--on-deep);border-bottom:1px solid var(--deep-line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand-mark{display:block;width:44px;height:44px}
.brand-word{display:block;height:32px;width:auto}
.brand{font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:.01em;text-decoration:none;display:flex;align-items:center;gap:14px}
.nav{display:flex;align-items:center;gap:6px}
.nav a{font:500 15px var(--font-body);text-decoration:none;padding:10px 12px;color:var(--on-deep-2)}
.nav a:hover,.nav a[aria-current="page"]{color:var(--on-deep)}
.nav a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
.sq{font:600 14px var(--font-body);background:transparent;color:var(--on-deep);border:1px solid var(--deep-line);border-radius:var(--r);min-width:44px;min-height:44px;padding:0 12px;cursor:pointer;display:grid;place-items:center}
.sq:hover{border-color:var(--on-deep-2)}
.sep{width:1px;height:24px;background:var(--deep-line);margin-inline:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:18px;min-height:52px;padding:14px 22px;border-radius:var(--r);font:600 16px var(--font-body);letter-spacing:.01em;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background-color .2s,border-color .2s,color .2s;background:transparent}
.btn svg{transition:transform .2s;flex:none}
.btn:hover svg{transform:translateX(4px)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#fff)}
.btn.line-dark{color:var(--on-deep);border-color:color-mix(in srgb,var(--on-deep) 35%,transparent)}
.btn.line-dark:hover{border-color:var(--on-deep)}
.btn.line{color:var(--fg);border-color:var(--line-strong)}
.btn.line:hover{border-color:var(--fg)}
.btn.off{color:var(--muted);border:1px dashed var(--line-strong);cursor:default}
.btn.off:hover svg{transform:none}
.btn.sm{min-height:44px;padding:10px 16px;font-size:15px;gap:12px}

/* home hero */
.hero{background:var(--deep);color:var(--on-deep);padding-block:88px 96px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--deep-line) 1px,transparent 1px),linear-gradient(90deg,var(--deep-line) 1px,transparent 1px);background-size:56px 56px;opacity:.35;mask-image:linear-gradient(100deg,transparent 45%,#000 85%);-webkit-mask-image:linear-gradient(100deg,transparent 45%,#000 85%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:64px;align-items:end}
.hero .label,.dir-hero .label{color:var(--accent)}
.hero h1{font-size:clamp(38px,6vw,68px);margin-top:22px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{font-size:19px;max-width:32em;margin-top:24px;color:var(--on-deep-2)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
.facts{border-top:1px solid var(--deep-line)}
.fact{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding-block:18px;border-bottom:1px solid var(--deep-line);align-items:baseline}
.fact b{font:500 26px var(--font-data);color:var(--accent)}
.fact span{color:var(--on-deep-2);font-size:15px}

section{padding-block:96px}
.sec-head{max-width:42em}
.sec-head h2{font-size:clamp(28px,4vw,44px);margin-top:16px}
.sec-head p{color:var(--muted);margin-top:16px;font-size:18px}

.why .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px}
.why .quote{font-family:var(--font-display);font-weight:500;font-size:clamp(24px,3vw,34px);line-height:1.3;margin-top:28px;padding-left:24px;border-left:2px solid var(--accent)}
.why .body{display:flex;flex-direction:column;gap:20px;font-size:18px;padding-top:44px}

.problems{background:var(--surface);border-block:1px solid var(--line)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);margin-top:48px;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.plist{display:flex;flex-direction:column;border-right:1px solid var(--line)}
.ptab{display:grid;grid-template-columns:44px minmax(0,1fr) 20px;gap:12px;align-items:center;text-align:left;padding:22px 24px;min-height:76px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--muted);cursor:pointer;font:500 17px var(--font-body)}
.ptab:last-child{border-bottom:0}
.ptab .n{font:500 13px var(--font-data);color:var(--muted)}
.ptab svg{opacity:0;transition:opacity .2s,transform .2s;color:var(--accent-ink)}
.ptab:hover{color:var(--fg)}
.ptab[aria-selected="true"]{background:var(--bg);color:var(--fg);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.ptab[aria-selected="true"] svg{opacity:1;transform:translateX(2px)}
.ppanel{padding:40px;display:flex;flex-direction:column;gap:28px;min-width:0}
.pblock .k{font:600 12px var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pblock p{margin-top:10px;font-size:18px}
.pblock.ours .k{color:var(--accent-ink)}
.pblock.ours p{font-family:var(--font-display);font-size:clamp(20px,2.4vw,26px);line-height:1.35;font-weight:500}
.pdots{display:flex;gap:6px;margin-top:auto}
.pdots i{width:22px;height:3px;background:var(--line)}
.pdots i.on{background:var(--accent)}

.promise-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:48px;border-top:1px solid var(--line-strong)}
.pr{padding:28px 24px 8px 0;display:flex;flex-direction:column;gap:12px}
.pr+.pr{padding-left:24px;border-left:1px solid var(--line)}
.pr .ix{font:500 13px var(--font-data);color:var(--accent-ink)}
.pr h3{font-size:21px}
.pr p{color:var(--muted);font-size:16px}

.band{background:var(--deep);color:var(--on-deep)}
.band .wrap{display:grid;grid-template-columns:minmax(0,1.3fr) auto;gap:40px;align-items:center}
.band h2{font-size:clamp(28px,4vw,44px)}
.band p{color:var(--on-deep-2);margin-top:14px;max-width:34em}
.band .count{font:500 13px var(--font-data);color:var(--accent);letter-spacing:.06em}

.contact .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:start}
.cards{display:flex;flex-direction:column;border-top:1px solid var(--line-strong)}
.ccard{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:24px;border-bottom:1px solid var(--line)}
.ccard .k{font:600 12px var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ccard .v{font:500 24px var(--font-data);user-select:all;margin-top:4px}
.ccard .who{color:var(--muted);font-size:15px;margin-top:2px}
.cacts{display:flex;gap:8px;flex-wrap:wrap}
.copy{font:600 14px var(--font-body);background:transparent;color:var(--fg);border:1px solid var(--line-strong);border-radius:var(--r);padding:0 16px;min-height:44px;cursor:pointer}
.copy:hover{border-color:var(--fg)}

footer{background:var(--deep);color:var(--on-deep-2);font-size:14px}
footer .wrap{padding-block:28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* directory */
.dir-hero{background:var(--deep);color:var(--on-deep);padding-block:64px 0}
.dir-hero h1{font-size:clamp(34px,5vw,56px);margin-top:18px}
.dir-hero p{color:var(--on-deep-2);margin-top:16px;max-width:36em;font-size:18px}
.toolbar{margin-top:40px;padding-block:20px 24px;border-top:1px solid var(--deep-line);display:flex;flex-direction:column;gap:16px}
.search{display:flex;align-items:center;gap:12px;background:var(--bg);color:var(--fg);border-radius:var(--r);padding:0 16px;min-height:56px;border:1px solid transparent}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:500 17px var(--font-body);min-height:54px;outline:0}
.search input::placeholder{color:var(--muted)}
.search button{background:transparent;border:0;color:var(--muted);cursor:pointer;min-width:44px;min-height:44px;font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{font:500 14px var(--font-body);background:transparent;color:var(--on-deep-2);border:1px solid var(--deep-line);border-radius:var(--r);min-height:40px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.fchip span{font:500 12px var(--font-data);opacity:.7}
.fchip:hover{color:var(--on-deep);border-color:var(--on-deep-2)}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sortbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sortbar .lbl{font:500 12px var(--font-data);color:var(--on-deep-2);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.sortbar .fchip{min-height:36px;font-size:13px}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:40;width:48px;height:48px;border-radius:50%;border:1px solid var(--deep-line);background:var(--deep);color:var(--on-deep);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.22);opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .2s,transform .2s,visibility .2s}
.totop.show{opacity:1;visibility:visible;transform:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .totop{background:var(--line-strong);color:var(--fg);border-color:var(--muted)}}
:root[data-theme="dark"] .totop{background:var(--line-strong);color:var(--fg);border-color:var(--muted)}
.totop:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media (prefers-reduced-motion: reduce){.totop{transition:none}}
.result-line{font:500 13px var(--font-data);color:var(--muted);padding-block:28px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);display:flex;flex-direction:column;overflow:hidden;transition:border-color .2s,transform .2s}
.acard:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.cover{aspect-ratio:16/9;max-width:100%;position:relative;background:var(--deep);display:block}
.cover img.cimg{width:100%;height:100%;object-fit:cover;display:block}
.cover .slides{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.cover .slides::-webkit-scrollbar{display:none}
.cover .slides img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;display:block;scroll-snap-align:start}
.cover .dots{position:absolute;right:8px;bottom:6px;display:flex;z-index:2}
.cover .dots span{padding:6px;cursor:pointer}
.cover .dots span::before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);box-shadow:0 0 2px rgba(0,0,0,.5)}
.cover .dots span.on::before{background:#fff}
.cover .pattern{position:absolute;inset:0;background-image:linear-gradient(var(--deep-line) 1px,transparent 1px),linear-gradient(90deg,var(--deep-line) 1px,transparent 1px);background-size:28px 28px;opacity:.6}
.cover .glyph{position:absolute;right:20px;bottom:16px;color:var(--accent);opacity:.9}
.logo{position:absolute;left:20px;bottom:-22px;width:56px;height:56px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font:700 18px var(--font-display);color:var(--fg);overflow:hidden;z-index:1}
.logo img{width:100%;height:100%;object-fit:cover}
.acard .body{padding:36px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.acard .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.acard h3{font-size:22px}
.acard .q{color:var(--muted);font-size:15px;flex:1}
.acard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.acard .acts .btn{flex:1 1 auto}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:600 11px var(--font-body);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--line-strong);border-radius:2px;color:var(--muted)}
.tag.free{border-color:var(--good);color:var(--good)}
.newmark{display:inline-flex;align-items:center;align-self:center;font:800 11px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--on-accent);padding:3px 10px;border-radius:999px;background-color:var(--accent);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 4px,transparent 4px 9px),linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:auto,250% 100%;background-position:0 0,150% 0;box-shadow:0 1px 3px rgba(0,0,0,.25);animation:newshine 3.2s ease-in-out infinite}
@keyframes newshine{0%,55%{background-position:0 0,150% 0}100%{background-position:0 0,-50% 0}}
@media (prefers-reduced-motion: reduce){.newmark{animation:none}}
.acard .body{position:relative}
.acard .body>.newmark{position:absolute;top:2px;left:88px}
.langs{font:500 12px var(--font-data);color:var(--muted)}
mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;padding:0 1px}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r-card);padding:48px 24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);font-size:22px;margin-bottom:8px}
.load-error{border:1px solid var(--error);border-left-width:4px;border-radius:var(--r);padding:20px 24px;margin-bottom:20px;background:var(--surface)}
.load-error h3{color:var(--error);font-size:20px}
.load-error p{margin-top:8px;color:var(--muted)}
.load-error code{font:500 14px var(--font-data);color:var(--fg);display:block;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.soon{border:1px dashed var(--line-strong);border-radius:var(--r-card);padding:36px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;margin-block:24px 96px}
.soon h3{font-size:24px}
.soon p{color:var(--muted);margin-top:8px}

/* detail */
.detail-top{background:var(--deep);color:var(--on-deep);padding-block:28px 56px}
.back{display:inline-flex;align-items:center;gap:10px;color:var(--on-deep-2);text-decoration:none;font:500 15px var(--font-body);min-height:44px}
.back:hover{color:var(--on-deep)}
.dhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;margin-top:20px}
.dlogo{width:80px;height:80px;border-radius:var(--r);background:var(--surface);color:var(--fg);display:grid;place-items:center;font:700 26px var(--font-display);overflow:hidden}
.dlogo img{width:100%;height:100%;object-fit:cover}
.dhead h1{font-size:clamp(32px,5vw,52px)}
.dhead .q{font-family:var(--font-display);font-size:20px;color:var(--accent);margin-top:6px}
.dhead .tags .tag{border-color:var(--deep-line);color:var(--on-deep-2)}
.dhead .tags .tag.free{border-color:var(--good);color:#8FD6A1}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;padding-block:56px 40px}
.dinfo{display:flex;flex-direction:column;gap:20px;min-width:0}
.dinfo .desc{font-size:18px}
.feats{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;font-size:16px;border-top:1px solid var(--line);padding-top:20px}
.feats li{display:flex;gap:10px;align-items:flex-start}
.feats li::before{content:"";flex:none;width:6px;height:6px;margin-top:10px;background:var(--accent)}
.dinfo small{color:var(--muted);font-size:13px;display:block}
.dinfo small+small{margin-top:-16px}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:28px;min-width:0}
.demo-head{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--font-data);color:var(--muted)}
.seg{display:grid;margin-top:16px;border:1px solid var(--line-strong);border-radius:var(--r)}
.seg button{background:transparent;border:0;border-right:1px solid var(--line-strong);padding:10px 12px;min-height:56px;cursor:pointer;color:var(--fg);text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.seg button:last-child{border-right:0}
.seg .cn{font:500 12px var(--font-data);color:var(--muted);overflow-wrap:anywhere}
.seg .cv{font:600 14px var(--font-body);font-variant-numeric:tabular-nums}
.seg .bar{height:3px;background:var(--line);width:100%}
.seg .bar i{display:block;height:100%;background:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--bg);box-shadow:inset 0 -2px 0 var(--accent)}
.seg button[aria-pressed="true"] .cn{color:var(--fg)}
svg.chart{width:100%;height:auto;display:block;margin-top:14px;touch-action:manipulation}
svg.chart .hit{cursor:pointer;fill:transparent}
svg.chart .sel{fill:color-mix(in srgb,var(--accent) 18%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:16px;height:2px;display:inline-block}
.info{margin-top:12px;min-height:52px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);font-size:15px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.info b{font:500 15px var(--font-data);font-variant-numeric:tabular-nums}
.st{font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px;color:#fff}
.note{font-size:12px;margin-top:10px;color:var(--muted)}
.shots{padding-bottom:96px}
.shots h2{font-size:24px;margin-bottom:16px}
.gallery{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.gallery img{flex:none;height:min(520px,70vh);width:auto;max-width:85%;border-radius:var(--r-card);border:1px solid var(--line);scroll-snap-align:start;object-fit:contain;background:var(--surface)}

@media (max-width:900px){

const ORDER=["zh","en","ms"];

try{const s=localStorage.getItem("wb-lang");if(ORDER.includes(s))lang=s;}catch(e){}
let APPS=[],appsReady=false;
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=v=>v==null?"":typeof v==="string"||typeof v==="number"?String(v):(v[lang]??v.en??v.zh??Object.values(v)[0]??"");
const LA=v=>Array.isArray(v)?v:(v&&(v[lang]||v.en||v.zh))||[];
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,o){const t=el("text",Object.assign({x,y,"font-size":10,"font-family":"JetBrains Mono, monospace",fill:"var(--muted)"},o||{}),p);t.textContent=s;return t}
const ARROW='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const EXT='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
const initials=n=>String(n).split(/\s+/).filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const catOf=a=>CATS[a.category]||{zh:a.category,en:a.category,ms:a.category,icon:'<circle cx="12" cy="12" r="8"/>'};
function openBtn(a,cls){
  const d=T[lang];
  return a.url?`<a class="btn primary ${cls}" href="${esc(a.url)}" target="_blank" rel="noopener" data-goatcounter-click="open-${esc(a.id)}"><span>${d.open}</span>${EXT}</a>`
              :`<span class="btn off ${cls}"><span>${d.soon}</span></span>`;
}
const round=v=>Math.round(v*100)/100;

/* ---------- problems tabs ---------- */
let prob=0;
function drawProbs(){
  const d=T[lang],list=$("plist");list.innerHTML="";
  d.probs.forEach((p,i)=>{
    const b=document.createElement("button");b.type="button";b.className="ptab";b.setAttribute("role","tab");b.setAttribute("aria-selected",i===prob);b.tabIndex=i===prob?0:-1;
    b.innerHTML=`<span class="n">0${i+1}</span><span>${p[0]}</span>${ARROW}`;
    b.addEventListener("click",()=>{prob=i;drawProbs()});
    b.addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();prob=(prob+(e.key==="ArrowDown"?1:3))%4;drawProbs();list.children[prob].focus()}});
    list.appendChild(b);
  });
  $("pProblem").textContent=d.probs[prob][1];
  $("pOurs").textContent=d.probs[prob][2];
  $("pdots").innerHTML=d.probs.map((_,i)=>`<i class="${i===prob?"on":""}"></i>`).join("");
}

/* ---------- directory: search + filter ---------- */
let query="",cat="all",sort="new";
try{const s=localStorage.getItem("wb-sort");if(["new","old","az"].includes(s))sort=s}catch(e){}
/* Newest/oldest use "added" (the date an app joined this site); apps added the same day keep their apps.json order. */
const NEW_DAYS=7;
const isNew=a=>{if(!a.added)return false;const age=(Date.parse(new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kuala_Lumpur"}))-Date.parse(a.added))/864e5;return age>=0&&age<NEW_DAYS};
const addedText=a=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(a.added||"");return m?T[lang].addedOn(T[lang].date(+m[1],+m[2],+m[3])):""};
const newTag=a=>isNew(a)?`<span class="newmark">${esc(T[lang].newTag)}</span>`:"";
const SORTS={
  new:(x,y)=>(y.added||"").localeCompare(x.added||"")||y._i-x._i,
  old:(x,y)=>(x.added||"").localeCompare(y.added||"")||x._i-y._i,
  az:(x,y)=>x.name.localeCompare(y.name,"en",{sensitivity:"base"})
};
function haystack(a){
  const parts=[a.name,a.keywords||"",(a.languages||[]).join(" "),a.category];
  for(const l of ORDER){const t=a[l]||{};parts.push(t.tagline||"",t.description||"",(t.features||[]).join(" "),catOf(a)[l]||"")}
  return parts.join(" ").toLowerCase();
}
function hl(s){
  const t=esc(s);if(!query)return t;
  const terms=query.split(/\s+/).filter(Boolean).map(q=>esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  return terms.length?t.replace(new RegExp(terms.join("|"),"gi"),m=>`<mark>${m}</mark>`):t;
}
function drawDir(){
  const d=T[lang];
  $("q").placeholder=d.search;
  $("qClear").hidden=!query;
  if(!appsReady){$("resultCount").textContent=$("loadError").hidden?d.loading:"";$("filters").innerHTML="";$("appGrid").innerHTML="";$("emptyState").hidden=true;return}
  const terms=query.toLowerCase().split(/\s+/).filter(Boolean);
  const textMatch=a=>terms.every(t=>a._h.includes(t));
  const f=$("filters");f.innerHTML="";
  const cats=[...new Set(APPS.map(a=>a.category))],rank=k=>{const i=Object.keys(CATS).indexOf(k);return i<0?99:i};
  const used=["all",...cats.sort((x,y)=>rank(x)-rank(y))];
  used.forEach(k=>{
    const n=APPS.filter(a=>(k==="all"||a.category===k)&&textMatch(a)).length;
    const b=document.createElement("button");b.type="button";b.className="fchip";b.setAttribute("aria-pressed",k===cat);
    b.innerHTML=`${k==="all"?d.all:esc(catOf({category:k})[lang])}<span>${n}</span>`;
    b.addEventListener("click",()=>{cat=k;drawDir()});f.appendChild(b);
  });
  const sb=$("sortbar");sb.innerHTML=`<span class="lbl">${esc(d.sortLabel)}</span>`;
  [["new",d.sortNew],["old",d.sortOld],["az",d.sortAZ]].forEach(([k,t])=>{
    const b=document.createElement("button");b.type="button";b.className="fchip";b.setAttribute("aria-pressed",k===sort);b.textContent=t;
    b.addEventListener("click",()=>{sort=k;try{localStorage.setItem("wb-sort",k)}catch(e){}drawDir()});sb.appendChild(b);
  });
  const list=APPS.filter(a=>(cat==="all"||a.category===cat)&&textMatch(a)).sort(SORTS[sort]);
  $("resultCount").textContent=d.results(list.length,APPS.length);
  $("emptyState").hidden=list.length>0;
  $("appGrid").innerHTML=list.map(a=>{
    const t=a[lang]||a.en||{},c=catOf(a);
    const covers=[].concat(a.cover||[]);
    const cover=covers.length>1?`<div class="slides">${covers.map(u=>`<img src="${esc(u)}" alt="" loading="lazy">`).join("")}</div><span class="dots">${covers.map((_,i)=>`<span data-i="${i}"${i?"":' class="on"'}></span>`).join("")}</span>`
      :covers.length?`<img class="cimg" src="${esc(covers[0])}" alt="" loading="lazy">`:`<div class="pattern"></div><svg class="glyph" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">${c.icon}</svg>`;
    const logo=a.logo?`<img src="${esc(a.logo)}" alt="">`:esc(initials(a.name));
    return `<article class="acard">
      <a class="cover" href="#app-${esc(a.id)}" aria-label="${esc(a.name)}">${cover}<span class="logo">${logo}</span></a>
      <div class="body">${newTag(a)}
        <div class="meta"><span class="tags"><span class="tag free">${d.free}</span><span class="tag">${hl(c[lang])}</span></span><span class="langs">${esc((a.languages||[]).join(" · "))}</span></div>
        <h3>${hl(a.name)}</h3>
        <p class="q">${hl(t.tagline||"")}</p>
        <div class="acts"><a class="btn line sm" href="#app-${esc(a.id)}"><span>${d.details}</span>${ARROW}</a>${openBtn(a,"sm")}</div>
      </div></article>`;
  }).join("");
}
$("q").addEventListener("input",e=>{query=e.target.value.trim();drawDir()});

/* Cover slideshow: swipe by hand, or it moves on by itself every 5 s. A swipe or dot tap pauses it for 8 s. */
const slideTo=(el,i)=>el.scrollTo({left:i*el.clientWidth,behavior:"smooth"});
const holdSlides=el=>{el.dataset.hold=Date.now()};
document.addEventListener("scroll",e=>{
  const el=e.target;if(!el.classList||!el.classList.contains("slides"))return;
  const i=Math.round(el.scrollLeft/el.clientWidth);
  el.parentElement.querySelectorAll(".dots span").forEach((d,k)=>d.classList.toggle("on",k===i));
},true);
for(const ev of ["pointerdown","touchstart","wheel"])document.addEventListener(ev,e=>{const el=e.target.closest&&e.target.closest(".slides");if(el)holdSlides(el)},{capture:true,passive:true});
document.addEventListener("click",e=>{
  const d=e.target.closest&&e.target.closest(".dots span");if(!d)return;
  e.preventDefault();e.stopPropagation();
  const el=d.closest(".cover").querySelector(".slides");holdSlides(el);slideTo(el,+d.dataset.i);
},true);
setInterval(()=>{
  if(document.hidden||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  document.querySelectorAll(".slides").forEach(el=>{
    if(!el.clientWidth||Date.now()-(+el.dataset.hold||0)<8000)return;
    const n=el.children.length,i=Math.round(el.scrollLeft/el.clientWidth);
    slideTo(el,(i+1)%n);
  });
},5000);
$("qClear").addEventListener("click",()=>{$("q").value="";query="";drawDir();$("q").focus()});

/* ---------- detail page ---------- */
let current=null,demoSel=0,demoX=0,demoFor=null;
function drawDetail(){
  const a=APPS.find(x=>x.id===current);if(!a)return;
  const d=T[lang],t=a[lang]||a.en||{},c=catOf(a);
  $("dLogo").innerHTML=a.logo?`<img src="${esc(a.logo)}" alt="">`:esc(initials(a.name));
  $("dTags").innerHTML=`<span class="tag free">${d.free}</span><span class="tag">${esc(c[lang])}</span>${newTag(a)}`;
  $("dName").textContent=a.name;
  $("dQ").textContent=t.tagline||"";
  $("dAct").innerHTML=openBtn(a,"");
  $("dDesc").textContent=t.description||"";
  $("dFeats").innerHTML=(t.features||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  $("dLangs").textContent=`${d.langsLabel}: ${(a.languages||[]).join(" · ")}${a.url?"":" · "+d.linkNote}`;
  $("dAdded").textContent=addedText(a);$("dAdded").hidden=!a.added;

  $("shotsBox").hidden=!shots.length;
  $("gallery").innerHTML=shots.map((s,i)=>`<img src="${esc(s)}" alt="${esc(a.name)} ${i+1}" loading="lazy">`).join("");
  const demo=a.demo;
  $("demoBox").hidden=!demo;
  if(demo){
    if(demoFor!==a.id){demoFor=a.id;demoSel=0;demoX=(demo.type==="compare")?Math.min(2,(demo.xLabels||[]).length-1):LA(demo.xLabels).length-1}
    $("demoTitle").textContent=L(demo.title);
    if(demo.type==="compare")drawCompare(demo);else drawTrend(demo);
  }
}

/* ---------- chart template: compare (bars = actual, lines = predictions) ---------- */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function drawCompare(demo){
  const d=T[lang],xs=LA(demo.xLabels),bars=demo.bars||{values:[]},lines=demo.lines||[],unit=demo.unit||"";
  const actual=bars.values;
  const mean=actual.reduce((s,v)=>s+v,0)/Math.max(1,actual.length)||1;
  lines.forEach(m=>{const mae=m.values.reduce((s,v,i)=>s+Math.abs(v-(actual[i]??0)),0)/Math.max(1,m.values.length);m._acc=Math.max(0,Math.round(100*(1-mae/mean)))});
  if(demoSel>=lines.length)demoSel=0;
  const box=$("demoChips");box.innerHTML="";box.hidden=false;box.style.gridTemplateColumns=`repeat(${Math.max(1,lines.length)},minmax(0,1fr))`;
  lines.forEach((m,i)=>{
    const b=document.createElement("button");b.type="button";b.setAttribute("aria-pressed",i===demoSel);
    b.innerHTML=`<span class="cn">${esc(L(m.name))}</span><span class="cv">${d.acc} ${m._acc}%</span><span class="bar"><i style="width:${m._acc}%"></i></span>`;
    b.addEventListener("click",()=>{demoSel=i;drawDetail()});box.appendChild(b);
  });
  const all=[...actual,...lines.flatMap(m=>m.values)],top=niceMax(Math.max(...all));
  const n=xs.length,W=360,x0=50,x1=345,step=n>1?(x1-x0)/(n-1):0;
  const fx=i=>n>1?x0+i*step:(x0+x1)/2,fy=v=>150-v/top*120;
  const s=$("demoChart");s.setAttribute("viewBox","0 0 360 180");s.innerHTML="";
  const bw=Math.min(18,step*.4||18),hw=Math.max(16,step/2||24);
  el("rect",{class:"sel",x:fx(demoX)-hw,y:22,width:hw*2,height:132},s);
  for(let k=0;k<=4;k++){const v=top*k/4;el("line",{x1:38,x2:352,y1:fy(v),y2:fy(v),stroke:"var(--line)"},s);txt(s,32,fy(v)+3,round(v),{"text-anchor":"end"})}
  actual.forEach((a,i)=>{el("rect",{x:fx(i)-bw/2,y:fy(a),width:bw,height:Math.max(0,150-fy(a)),fill:"var(--accent)",opacity:i===demoX?1:.65},s)});
  xs.forEach((x,i)=>txt(s,fx(i),170,x,{"text-anchor":"middle",fill:i===demoX?"var(--fg)":"var(--muted)","font-weight":i===demoX?700:400}));
  const m=lines[demoSel];
  if(m){
    el("polyline",{points:m.values.map((v,i)=>`${fx(i)},${fy(v)}`).join(" "),fill:"none",stroke:"var(--fc)","stroke-width":2,"stroke-linejoin":"round"},s);
    m.values.forEach((v,i)=>el("circle",{cx:fx(i),cy:fy(v),r:i===demoX?5:2.5,fill:"var(--fc)",stroke:"var(--surface)","stroke-width":i===demoX?2:0},s));
  }
  xs.forEach((x,i)=>{const h=el("rect",{class:"hit",x:fx(i)-hw,y:20,width:hw*2,height:156},s);h.addEventListener("click",()=>{demoX=i;drawDetail()})});
  $("demoLegend").innerHTML=`<span><i style="background:var(--fc)"></i>${esc(m?L(m.name):"")}</span><span><i style="background:var(--accent);height:8px;width:10px"></i>${esc(L(bars.name))}</span><span>${esc(unit)}</span>`;
  if(m){
    const p=m.values[demoX],a=actual[demoX],diff=round(Math.abs(p-a)),rel=diff/(mean||1);
    $("demoInfo").innerHTML=`<strong>${esc(xs[demoX])}</strong><span>${esc(L(m.name))} <b>${p} ${esc(unit)}</b> · ${esc(L(bars.name))} <b>${a} ${esc(unit)}</b></span><span class="st" style="background:${rel<=.25?"var(--good)":rel<=.6?"var(--mid)":"var(--weak)"}">${esc(d.diff(diff))}</span>`;
  }
  $("demoHint").textContent=d.hintCompare;
}

/* ---------- chart template: trend (several lines over time) ---------- */
const TREND_COLORS=["var(--good)","var(--fc)","var(--weak)","var(--mid)"];
function drawTrend(demo){
  const d=T[lang],xs=LA(demo.xLabels),lines=demo.lines||[],unit=demo.unit||"";
  if(demoSel>=lines.length)demoSel=0;
  if(demoX>=xs.length)demoX=xs.length-1;
  const fv=v=>`${demo.signed&&v>0?"+":""}${v} ${unit}`.trim();
  const box=$("demoChips");box.innerHTML="";box.hidden=lines.length<2;box.style.gridTemplateColumns=`repeat(${Math.max(1,lines.length)},minmax(0,1fr))`;
  lines.forEach((ln,i)=>{
    const last=ln.values[ln.values.length-1];
    const b=document.createElement("button");b.type="button";b.setAttribute("aria-pressed",i===demoSel);
    b.innerHTML=`<span class="cn"><span style="display:inline-block;width:8px;height:8px;background:${TREND_COLORS[i%4]};margin-right:6px"></span>${esc(L(ln.name))}</span><span class="cv">${esc(fv(last))}</span>`;
    b.addEventListener("click",()=>{demoSel=i;drawDetail()});box.appendChild(b);
  });
  const all=lines.flatMap(l=>l.values),lo=Math.min(...all),hi=Math.max(...all),pad=(hi-lo)*.15||1;
  const y0=demo.yMin??lo-pad,y1=demo.yMax??hi+pad,n=xs.length,x0=50,x1=345,step=n>1?(x1-x0)/(n-1):0;
  const fx=i=>n>1?x0+i*step:(x0+x1)/2,fy=v=>130-(v-y0)/(y1-y0)*110;
  const s=$("demoChart");s.setAttribute("viewBox","0 0 360 160");s.innerHTML="";
  const hw=Math.max(12,step/2||20);
  el("rect",{class:"sel",x:fx(demoX)-hw,y:14,width:hw*2,height:122},s);
  const raw=(y1-y0)/3,mag=10**Math.floor(Math.log10(raw)),tick=[1,2,2.5,5,10].map(m=>m*mag).find(t=>t>=raw/1.5);
  for(let v=Math.ceil(y0/tick)*tick;v<=y1+1e-9;v+=tick){const r=round(v);el("line",{x1:38,x2:352,y1:fy(r),y2:fy(r),stroke:"var(--line)"},s);txt(s,32,fy(r)+3,(demo.signed&&r>0?"+":"")+r,{"text-anchor":"end"})}
  (demo.refs||[]).forEach(r=>{el("line",{x1:38,x2:352,y1:fy(r.value),y2:fy(r.value),stroke:"var(--muted)","stroke-dasharray":"3 3",opacity:.7},s);txt(s,42,fy(r.value)-3,L(r.name),{"font-size":9})});
  xs.forEach((x,i)=>txt(s,fx(i),152,x,{"text-anchor":"middle",fill:i===demoX?"var(--fg)":"var(--muted)","font-weight":i===demoX?700:400}));
  lines.forEach((ln,i)=>{if(i!==demoSel)el("polyline",{points:ln.values.map((v,j)=>`${fx(j)},${fy(v)}`).join(" "),fill:"none",stroke:TREND_COLORS[i%4],"stroke-width":1.25,opacity:.35},s)});
  const ln=lines[demoSel],col=TREND_COLORS[demoSel%4];
  if(ln){
    el("polyline",{points:ln.values.map((v,j)=>`${fx(j)},${fy(v)}`).join(" "),fill:"none",stroke:col,"stroke-width":2.5,"stroke-linejoin":"round"},s);
    ln.values.forEach((v,j)=>el("circle",{cx:fx(j),cy:fy(v),r:j===demoX?5:2.5,fill:col,stroke:"var(--surface)","stroke-width":j===demoX?2:0},s));
  }
  xs.forEach((x,i)=>{const h=el("rect",{class:"hit",x:fx(i)-hw,y:10,width:hw*2,height:146},s);h.addEventListener("click",()=>{demoX=i;drawDetail()})});
  $("demoLegend").innerHTML="";
  if(ln){
    const v=ln.values[demoX],ch=round(v-ln.values[0]);
    $("demoInfo").innerHTML=`<strong>${esc(L(ln.name))} · ${esc(xs[demoX])}</strong><b>${esc(fv(v))}</b><span style="color:var(--muted)">${esc(d.vsFirst(ch,xs[0],unit))}</span>`;
  }
  $("demoHint").textContent=lines.length<2?d.hintTrend1:d.hintTrend;
}

/* ---------- load apps.json ---------- */
function lineCol(text,pos){const before=text.slice(0,pos).split("\n");return `line ${before.length}, column ${before[before.length-1].length+1}`}
async function loadApps(){
  let text="";
  try{
    const r=await fetch("apps.json",{cache:"no-cache"});
    if(!r.ok)throw new Error(`HTTP ${r.status}: apps.json not found`);
    text=await r.text();
    let data;
    try{data=JSON.parse(text)}catch(e){
      const m=String(e.message).match(/position (\d+)/);
      throw new Error(m?`${e.message} (${lineCol(text,+m[1])})`:e.message);
    }
    if(!Array.isArray(data))throw new Error("apps.json must start with [ and end with ]");
    data.forEach((a,i)=>{if(!a.id||!a.name)throw new Error(`App #${i+1} is missing "id" or "name"`)});
    APPS=data;APPS.forEach((a,i)=>{a._h=haystack(a);a._i=i});appsReady=true;
  }catch(e){
    $("loadError").hidden=false;$("errDetail").textContent=String(e.message||e);
  }
  $("bandCount").textContent=T[lang].bandCount(APPS.length);
  drawDir();route();
}

/* ---------- views: #home, #apps, #app-<id>, #contact ---------- */
function route(){
  const h=location.hash.replace("#","");
  const isDetail=h.startsWith("app-")&&APPS.some(a=>"app-"+a.id===h);
  const isDir=h==="apps"||(h.startsWith("app-")&&!isDetail);
  const isHome=!isDetail&&!isDir;
  $("viewHome").hidden=!isHome;$("viewApps").hidden=!isDir;$("viewApp").hidden=!isDetail;
  $("navHome").removeAttribute("aria-current");$("navApps").removeAttribute("aria-current");
  (isHome?$("navHome"):$("navApps")).setAttribute("aria-current","page");
  if(isDetail){current=h.slice(4);drawDetail()}
  const target=isHome&&h&&h!=="home"?$(h):null;
  if(target)requestAnimationFrame(()=>target.scrollIntoView());else window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* Back-to-top button: shows after about one screen of scrolling. */
const toTop=$("toTop");
const syncTop=()=>toTop.classList.toggle("show",scrollY>innerHeight*.8);
addEventListener("scroll",syncTop,{passive:true});syncTop();
toTop.addEventListener("click",()=>{scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});document.querySelector(".brand")?.focus({preventScroll:true})});

/* ---------- language ---------- */
function apply(){
  const d=T[lang];
  document.documentElement.lang=lang==="zh"?"zh-Hans":lang==="ms"?"ms":"en";
  document.querySelectorAll("[data-i18n]").forEach(e=>{const v=d[e.dataset.i18n];e.textContent=typeof v==="string"?v:""});
  document.querySelectorAll("[data-i18n-html]").forEach(e=>{e.innerHTML=d[e.dataset.i18nHtml]??""});
  $("langBtn").textContent=d.pill;
  $("toTop").setAttribute("aria-label",d.toTop);$("toTop").title=d.toTop;
  $("bandCount").textContent=d.bandCount(APPS.length);
  drawProbs();drawDir();if(current)drawDetail();
}
$("langBtn").addEventListener("click",()=>{
  lang=ORDER[(ORDER.indexOf(lang)+1)%ORDER.length];
  try{localStorage.setItem("wb-lang",lang)}catch(e){}
  apply();
});
/* First visit: ask for a language. English is the default if they close it with Esc. */
(()=>{
  const box=$("langPick");let first=false;
  try{first=localStorage.getItem("wb-lang")===null}catch(e){}
  if(!first)return;
  const pick=l=>{lang=l;try{localStorage.setItem("wb-lang",l)}catch(e){}
    box.hidden=true;document.documentElement.classList.remove("lp-open");document.removeEventListener("keydown",esc);apply()};
  const esc=e=>{if(e.key==="Escape")pick("en")};
  box.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>pick(b.dataset.pick)));
  document.addEventListener("keydown",esc);
  box.hidden=false;document.documentElement.classList.add("lp-open");
  box.querySelector("[data-pick]").focus();
})();

/* ---------- light / dark ---------- */
const root=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)");
const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON='<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>';
function isDark(){const t=root.getAttribute("data-theme");return t?t==="dark":mq.matches}
function drawTheme(){$("themeIcon").innerHTML=isDark()?SUN:MOON}
try{const s=localStorage.getItem("wb-theme");if(s==="dark"||s==="light")root.setAttribute("data-theme",s)}catch(e){}
$("themeBtn").addEventListener("click",()=>{
  const next=isDark()?"light":"dark";
  root.setAttribute("data-theme",next);
  try{localStorage.setItem("wb-theme",next)}catch(e){}
  drawTheme();
});
mq.addEventListener("change",drawTheme);

/* ---------- copy ---------- */
document.querySelectorAll(".copy").forEach(b=>b.addEventListener("click",()=>{
  const e=$(b.dataset.copy);
  const done=()=>{b.textContent=T[lang].copied;setTimeout(()=>b.textContent=T[lang].copy,1500)};
  const sel=()=>{const r=document.createRange();r.selectNodeContents(e);const s=getSelection();s.removeAllRanges();s.addRange(r)};
  if(navigator.clipboard){navigator.clipboard.writeText(e.textContent.trim()).then(done,sel)}else sel();
}));

drawTheme();apply();route();loadApps();
</script>
</body>
